<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion FAQ - Reference</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'DM Sans', sans-serif;
            background-color: #e6edf3;
            color: #0d1117;
            padding: 4rem 1rem;
        }

        /* SECTION */
        .faq__section{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        /* HEADER */
        .faq__eyebrow{
            text-transform: uppercase;
            color: #2563eb;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
        }

        .faq__heading{
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-transform: capitalize;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .faq__sub{
            color: #64748b;
            font-size: 0.9rem;
            max-width: 480px;
            text-align: center;
            margin-bottom: 2.5rem;
            font-weight: 300;
            line-height: 1.7;
        }

        /* CONTAINER */
        .faq__container{
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .faq__item{
           background-color: #fff;
           border: 1px solid #e2e8f0;
           border-radius: 10px;
           overflow: hidden;
           transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .faq__item.open{
            border-color: #bfdbfe;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }

        .faq__question{
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: color 0.2s;
        }

        .faq__question:hover{
            color: #2563eb;
        }

        .faq__icon{
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border: 1.5px solid #cbd5e1;
            border-radius: 50%;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #64748b;
            transition: transform 0.3s ease, background 0.2s, border-color 0.2s, color 0.2s;
            pointer-events: none; 
        }

        .faq__item.open .faq__icon {
            transform: rotate(180deg);
            background-color: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .faq__item.open .faq__question{
            color: #2563eb;
        }

        .faq__answer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s ease;
        }
        
        .faq__item.open .faq__answer{
            grid-template-rows: 1fr;
        }

        /* Required wrapper — overflow hidden clips the content */
        .faq__answer__inner {
        overflow: hidden;
        }

        .faq__answer p{
            padding: 0 1.5rem 1.25rem;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 300;
            line-height: 1.75;
        }

        /* FOOTER */
        .faq__footer{
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .faq__footer a{
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color o.2s;            
        }

        .faq__footer a:hover{
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <section class="faq__section">
        <p class="faq__eyebrow">Got questions?</p>
        <h1 class="faq__heading">frequently asked questions</h1>
        <p class="faq__sub">Everything you need to know. Can't find an answer? Feel free to reach out.</p>

        <div class="faq__container" id="faq__container"></div>

        <p class="faq__footer">Still have questions? <a href="#">Get in touch →</a></p>
    </section>
    

    <script>
        const faqs = [
            {
                question: 'What is your design process?',
                answer:   'I start with research and discovery — understanding the problem, the users, and the constraints. From there I move into sketching, wireframing, and prototyping before handing off clean specs for development.'
            },
            {
                question: 'Do you take on freelance projects?',
                answer:   'Yes — I take on selected freelance work for product design, UX audits, and front-end development. The best way to start is to send me a brief overview of your project via email.'
            },
            {
                question: 'What tools do you work with?',
                answer:   'For design I primarily use Figma. For development I work with HTML, CSS, JavaScript, and React. I also use Framer for interactive prototypes and Notion for documentation.'
            },
            {
                question: 'How long does a typical project take?',
                answer:   'It depends on scope. A focused UX audit takes about one week. A full product design engagement typically runs four to eight weeks. I always provide a detailed timeline estimate after our initial discovery call.'
            },
            {
                question: 'Are you open to full-time opportunities?',
                answer:   'I am currently open to full-time product designer and design engineer roles. I am particularly interested in teams working on complex, meaningful problems with a strong design culture.'
            }
        ]

        const faqContainer = document.getElementById('faq__container');
    

        function renderFAQ(faqs) {
            faqs.forEach((faq, index) => {
                const item = document.createElement('div');
                item.className = 'faq__item';
                item.dataset.index = index;

                // 
                item.innerHTML = `
                    <button class="faq__question">
                        <span>${faq.question}</span>
                        <span class="faq__icon" aria-hidden="true">X</span>
                    </button>
                    <div class="faq__answer" role="region">
                        <div class="faq__answer__inner">
                            <p>${faq.answer}</p>
                        </div>
                    </div>
                `

                faqContainer.appendChild(item);
            });

        }

        function closeAll() {
            faqContainer.querySelectorAll('.faq__item').forEach((item) => 
                item.classList.remove('open')
            )
        }

        faqContainer.addEventListener('click', function (e) {
            const question = e.target.closest('.faq__question');
            
            if(!question) return;

            const item = question.closest('.faq__item')
            const isOpen = item.classList.contains('open');
            
            closeAll();
            
            if(!isOpen){ 
                item.classList.add('open');
            }
        })
       
        renderFAQ(faqs)
    </script>
</body>
</html>
